# ~/.config/starship.toml

add_newline = false
command_timeout = 18000000

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"

[c]
detect_extensions = ["c", "h", "cu", "cuh"]
format = "[$symbol($version(-$name))]($style) "

[character]
success_symbol = "[󰅂](bold green)"
error_symbol = "[󰅂](bold red)"

[cmd_duration]
min_time = 1000
format = "[$duration]($style) "

[directory]
truncation_length = 2
format = "[$path]($style)[$read_only]($read_only_style) "
fish_style_pwd_dir_length = 0

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "

[golang]
symbol = " "

[hostname]
ssh_only = true

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[line_break]
disabled = true

[lua]
symbol = "󰽧 "
format = "[$symbol($version)]($style) "

[memory_usage]
symbol = "󰍛"

[nodejs]
symbol = " "
disabled = true

[package]
symbol = " "

[php]
symbol = " "

[conda]
symbol = " "
format = "[${symbol}(${environment})]($style) "
style = "bold green"
ignore_base = true

[pixi]
symbol = " "
format = "[${symbol}(${environment})]($style) "
style = "bold green"

[python]
symbol = " "
format = "[${symbol}(${version})(($virtualenv))]($style) "
style = "bold yellow"
python_binary = ["python3"]
detect_extensions = ["py"]
version_format = "v${raw}"

[ruby]
symbol = " "
disabled = true

[rust]
symbol = " "

